# Glacier — docker compose stack (Stage 3).
#
# Start:   docker compose up -d --build
# Stop:    docker compose down
# Logs:    docker compose logs -f glacier
# Open UI: http://<server-ip>:5050   (or GLACIER_PORT if you override it)
#
# Data persists across restarts/upgrades in the `glacier-data` named volume:
# settings (~/.glacier_settings.json) and the scan cache (~/.glacier_cache).
#
# Scenario on a Windows host:
#   1. cp .env.example .env  (edit if needed)
#   2. docker compose up -d --build
#   3. In Glacier → Libraries, add your music folder(s) using the CONTAINER path
#      (e.g. /music, or /music2 if you added a second mount below).
#   4. Browse to http://localhost:5050
#
# NOTE: Glacier manages (scans / organizes / moves / tags / covers) the folders
# you mount here. Only give it folders you are happy for it to modify.

services:
  glacier:
    build:
      context: .
      dockerfile: Dockerfile
    image: glacier:stage3
    container_name: glacier
    restart: unless-stopped
    # Run as root so Glacier can fully access every bind-mounted music folder
    # (it browses, scans, organizes, moves and tags the mounted files). This is
    # intentional and required for the app to work.
    user: "0:0"
    ports:
      - "${GLACIER_PORT:-5050}:5050"
    environment:
      HOME: /data
      TZ: "${TZ:-UTC}"
    volumes:
      # Persistent settings + scan cache. Do not remove.
      - glacier-data:/data

      # ----- Host file system -----
      # Your music lives on the HOST (e.g. /mnt/music and /mnt/MusicFolder).
      # A container is isolated, so it CANNOT see the host's /mnt on its own.
      # Bind the host /mnt into the container at /mnt (overrides the empty
      # container /mnt) so Glacier's file explorer shows the exact same tree as
      # your native file browser. Configure the source with HOST_MNT in .env.
      - "${HOST_MNT:-/mnt}:/mnt"

      # ----- Music libraries (alternative / extra bind mounts) -----
      # If your music is elsewhere (not under /mnt), mount it explicitly and
      # enter the CONTAINER path in Glacier → Libraries, e.g.:
      #   - "${MUSIC_DIR:-./music}:/music"

volumes:
  glacier-data:
